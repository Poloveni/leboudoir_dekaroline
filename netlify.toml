# ═══════════════════════════════════════════════════
#  CONFIGURATION NETLIFY — Le Boudoir de Karoline
# ═══════════════════════════════════════════════════

[build]
  publish   = "."          # Dossier racine du site
  functions = "netlify/functions"   # Dossier des fonctions serverless

[functions]
  node_bundler = "esbuild"  # Bundler moderne, plus rapide

# ── Headers de sécurité ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── Autoriser l'appel des fonctions depuis le frontend ──
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "POST, OPTIONS"
