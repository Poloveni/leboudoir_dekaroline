# ═══════════════════════════════════════════════════
#  CONFIGURATION NETLIFY — Le Boudoir de Karoline
# ═══════════════════════════════════════════════════

[build]
  publish   = "."
  functions = "netlify/functions"

# ── Headers de sécurité ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
