<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page introuvable — Le Boudoir de Karoline</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%231E0318'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia%2C serif' font-size='38' font-style='italic' font-weight='bold' fill='url(%23g)'%3EK%3C/text%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FFD060'/%3E%3Cstop offset='50%25' stop-color='%23FF7A1A'/%3E%3Cstop offset='100%25' stop-color='%23E8156D'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root {
  --fuchsia:#C4687A; --coral:#D4896A; --gold:#C9A96E;
  --ivory:#FDF6F0; --plum:#3D1A2A; --dark:#2A1018; --text:#3D1F28;
  --serif:'Playfair Display',serif; --sans:'DM Sans',sans-serif;
}
body {
  background: var(--dark); color: #fff;
  font-family: var(--sans); font-weight: 300;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 40px 24px;
  overflow: hidden;
}

/* Fond doux */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(196,104,122,0.15) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 70%, rgba(212,137,106,0.1) 0%, transparent 55%);
}

.content { position: relative; z-index: 1; max-width: 560px; }

.num {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(7rem, 20vw, 12rem);
  color: transparent;
  -webkit-text-stroke: 1px rgba(201,169,110,0.4);
  line-height: 1;
  margin-bottom: 8px;
  animation: fadeUp 0.8s ease both;
}
.eyebrow {
  font-size: 0.6rem; letter-spacing: 0.35em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 20px;
  animation: fadeUp 0.8s 0.15s ease both;
}
h1 {
  font-family: var(--serif); font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 400; color: rgba(255,249,240,0.9);
  margin-bottom: 16px;
  animation: fadeUp 0.8s 0.25s ease both;
}
p {
  font-size: 0.92rem; line-height: 1.8;
  color: rgba(255,249,240,0.45);
  margin-bottom: 40px;
  animation: fadeUp 0.8s 0.35s ease both;
}
.btns {
  display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
  animation: fadeUp 0.8s 0.45s ease both;
}
.btn-primary {
  display: inline-block;
  background: linear-gradient(135deg, var(--fuchsia), var(--coral));
  color: #fff; font-family: var(--sans); font-size: 0.68rem;
  letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500;
  padding: 14px 32px; text-decoration: none;
  transition: transform 0.3s, box-shadow 0.3s;
  box-shadow: 0 6px 24px rgba(196,104,122,0.4);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(196,104,122,0.55); }
.btn-outline {
  display: inline-block;
  border: 1px solid rgba(201,169,110,0.35); color: var(--gold);
  font-family: var(--sans); font-size: 0.68rem;
  letter-spacing: 0.2em; text-transform: uppercase;
  padding: 14px 32px; text-decoration: none;
  transition: background 0.3s, color 0.3s;
}
.btn-outline:hover { background: var(--gold); color: var(--dark); }

.logo {
  font-family: 'Great Vibes', cursive; font-size: 1.4rem;
  color: rgba(201,169,110,0.3); margin-top: 60px;
  animation: fadeIn 1.2s 0.6s ease both;
}

@keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
@keyframes fadeIn { from{opacity:0;} to{opacity:0.3;} }
</style>
</head>
<body>
<div class="content">
  <div class="num">404</div>
  <div class="eyebrow">✦ Page introuvable ✦</div>
  <h1>On a cherché partout…<br>même dans les pelotes de laine !</h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée.<br>Pas de panique — les créations de Karoline vous attendent.</p>
  <div class="btns">
    <a href="boutique.html" class="btn-primary">Voir la boutique</a>
    <a href="index.html" class="btn-outline">Retour à l'accueil</a>
  </div>
  <div class="logo">Le Boudoir de Karoline</div>
</div>
</body>
</html>
